name: Native television practice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lesson timeline
        run: node --experimental-strip-types src/lesson.check.ts
      - name: Prepare official virtual device
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool ffmpeg libglu1-mesa libegl1 libgl1-mesa-dri mesa-utils libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 lz4
      - name: Build and exercise native practice
        run: bash scripts/runtime.sh
      - name: Collect native evidence and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-again-native
          path: temp/evidence/
          retention-days: 3
          if-no-files-found: warn
